  <circle cx="56" cy="97" r="25" fill="none" stroke="#30d158" stroke-width="2"/>
  <circle cx="56" cy="97" r="9" fill="#30d158"/>
  <text x="94" y="87" fill="#ffffff" font-family="Arial,sans-serif" font-size="16" font-weight="700">START</text>
  <text x="94" y="110" fill="#aab6cc" font-family="Arial,sans-serif" font-size="8">0 CLIPS</text>
  <text x="20" y="143" fill="#aab6cc" font-family="Arial,sans-serif" font-size="8">TAP TO TOGGLE</text>

  <rect x="176" y="39" width="136" height="54" rx="14" fill="#087ea4"/>
  <rect x="190" y="56" width="22" height="15" fill="none" stroke="#fff"/>
