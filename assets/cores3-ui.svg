<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 320 240" role="img" aria-labelledby="title description">
  <title id="title">Alpha Photon CoreS3 touch interface</title>
  <desc id="description">Main remote screen with video, photo, tools, autofocus, camera connection and battery status.</desc>
  <rect width="320" height="240" rx="12" fill="#08101f"/>
  <rect width="320" height="32" rx="12" fill="#111827"/>
  <rect y="20" width="320" height="12" fill="#111827"/>
  <text x="10" y="19" fill="#18d8f2" font-family="Arial,sans-serif" font-size="9" font-weight="700">ALPHA PHOTON</text>
  <circle cx="106" cy="15" r="5" fill="#30d158"/>
  <text x="116" y="19" fill="#f7fafc" font-family="Arial,sans-serif" font-size="8">CAM READY</text>
  <rect x="240" y="9" width="18" height="11" rx="2" fill="none" stroke="#f7fafc"/>
  <rect x="258" y="12" width="2" height="5" fill="#f7fafc"/>
  <rect x="243" y="12" width="12" height="5" fill="#30d158"/>
  <text x="263" y="19" fill="#f7fafc" font-family="Arial,sans-serif" font-size="8">100%</text>

  <rect x="8" y="39" width="160" height="114" rx="16" fill="#202c46"/>
